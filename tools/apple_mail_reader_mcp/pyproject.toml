[project]
name = "apple-mail-ai-reader-mcp"
version = "0.3.0"
description = "Local MCP for macOS Mail.app AI triage (read, mark read, unsubscribe)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.6.0,<2"]

[project.scripts]
apple-mail-ai-reader-mcp = "apple_mail_reader_mcp.server:main"
apple-mail-reader-mcp = "apple_mail_reader_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_mail_reader_mcp"]
